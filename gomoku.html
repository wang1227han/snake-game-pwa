  <title>五子棋 · Gomoku</title>
  <style>
    :root {
      --bg-0: #0b1020;
      --panel: rgba(255, 255, 255, 0.04);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-0: #e8ecf5;
      --text-1: #9aa6c4;
      --accent: #4ade80;
      --accent-2: #22d3ee;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(1200px 800px at 50% -10%, #1a2440, var(--bg-0));
      color: var(--text-0);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 14px;
    }
    .app { width: 100%; max-width: 460px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px;
      border-radius: 10px; border: 1px solid var(--panel-border); background: var(--panel);
      color: var(--text-1); font-size: 13px; text-decoration: none;
    }
    .back-link:hover { color: var(--text-0); }
    .title { display: flex; align-items: baseline; gap: 8px; }
    .title h1 { font-size: 20px; font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .title .sub { font-size: 12px; color: var(--text-1); }

    .diff { display: flex; gap: 8px; margin-bottom: 12px; }
    .diff button {
      flex: 1; padding: 9px 4px; border-radius: 10px; cursor: pointer;
      border: 1px solid var(--panel-border); background: var(--panel);
      color: var(--text-1); font-size: 13px; font-weight: 600;
      transition: all 0.12s ease;
    }
    .diff button.active { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #06121f; border-color: transparent; }

    .status {
      text-align: center; margin-bottom: 10px; font-size: 14px; min-height: 20px;
      color: var(--text-0); font-weight: 600;
    }
    .status.win { color: var(--accent); }
    .status.lose { color: var(--danger); }

    .board-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; }
    canvas { width: 100%; height: 100%; border-radius: 14px; display: block;
      background: #d9b27c; box-shadow: 0 10px 30px rgba(0,0,0,0.35); touch-action: none; }

    .footer { display: flex; justify-content: center; margin-top: 12px; }
    .btn {
      padding: 10px 22px; border-radius: 12px; cursor: pointer; border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #06121f; font-weight: 700; font-size: 15px;
    }
    .hint { text-align: center; color: var(--text-1); font-size: 12px; margin-top: 10px; }

    .side { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .side-label { color: var(--text-1); font-size: 13px; }
    .side button {
      flex: 1; padding: 8px 4px; border-radius: 10px; cursor: pointer;
      border: 1px solid var(--panel-border); background: var(--panel);
      color: var(--text-1); font-size: 13px; font-weight: 600;
      transition: all 0.12s ease;
    }
    .side button.active { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #06121f; border-color: transparent; }

    .status.scramble { color: var(--accent-2); animation: blink 0.8s infinite; }
    @keyframes blink { 50% { opacity: 0.45; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <a class="back-link" href="index.html">← 大厅</a>
      <div class="title"><h1>五子棋</h1><span class="sub">GOMOKU</span></div>
      <span style="width:54px"></span>
    </div>

    <div class="diff" id="diff">
      <button data-level="easy">简单</button>
      <button data-level="medium" class="active">中等</button>
      <button data-level="hard">困难</button>
      <button data-level="insane">吊炸天</button>
      <button data-level="hell">地狱</button>
    </div>

    <div class="side" id="side">
      <span class="side-label">你执</span>
      <button data-side="black" class="active">黑·先手</button>
      <button data-side="white">白·后手</button>
    </div>

    <div class="status" id="status">你执黑先行，点击棋盘落子</div>

    <div class="board-wrap">
      <canvas id="board"></canvas>
    </div>

    <div class="footer">
      <button class="btn" id="restart">新对局</button>
    </div>
    <div class="hint" id="hint">黑棋先手 · 五子连珠即胜 · 困难/吊炸天/地狱 黑棋受「禁手」限制 · 地狱每 20 手重组棋盘</div>
  </div>

  <script>
  (function () {
    "use strict";
    const GRID = 15;          // 15x15 棋盘
    const EMPTY = 0, BLACK = 1, WHITE = 2;
    const WIN = 1e9;

    let board = [];           // board[r][c]
    let current = BLACK;      // 当前轮到谁落子（五子棋恒为黑先）
    let gameOver = false;
    let lastMove = null;      // {r,c}
    let level = "medium";
    let thinking = false;

    // 执棋方：玩家与 AI 各执一色（黑恒先手）
    let humanColor = BLACK;
    let aiColor = WHITE;

    // 地狱难度：每 20 手重组棋盘
    let plyCount = 0;
    let scrambling = false;
    let scrambleStart = 0;
    let scrambleParticles = [];

    function isHardPlus(l) { return l === "hard" || l === "insane" || l === "hell"; }
    function forbiddenActive() { return isHardPlus(level); } // 困难以上黑棋受禁手限制

    // ---------- 难度配置 ----------
    const LEVELS = {
      easy:   { cap: 0 },                                  // 仅随机（带明显的赢/挡）
      medium: { cap: 0 },                                  // 贪心单步评分
      hard:   { depth: 2, cap: 14 },                       // 2 层搜索 + 黑棋禁手
      insane: { depth: 4, cap: 10 },                       // 4 层 α-β 搜索 + 黑棋禁手
      hell:   { depth: 4, cap: 12, scramble: true }        // 吊炸天强度 + 每 20 手重组棋盘
    };

    // ---------- 工具 ----------
    function inBounds(r, c) { return r >= 0 && r < GRID && c >= 0 && c < GRID; }

    function patternValue(len, openEnds) {
      if (len >= 5) return WIN;
      if (openEnds === 0) return 0;
      if (len === 4 && openEnds === 2) return 100000; // 活四：必胜
      if (len === 4 && openEnds === 1) return 12000;  // 冲四
      if (len === 3 && openEnds === 2) return 4000;   // 活三
      if (len === 3 && openEnds === 1) return 400;    // 眠三
      if (len === 2 && openEnds === 2) return 400;
      if (len === 2 && openEnds === 1) return 40;
      if (len === 1 && openEnds === 2) return 20;
      if (len === 1 && openEnds === 1) return 2;
      return 0;
    }

    // 假设 board[r][c] 已是 player，计算此点四方向局部分
    function pointScore(b, r, c, player) {
      let total = 0;
      const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      for (let k = 0; k < dirs.length; k++) {
        const dr = dirs[k][0], dc = dirs[k][1];
        let count = 1, open = 0;
        let i = r + dr, j = c + dc;
        while (inBounds(i, j) && b[i][j] === player) { count++; i += dr; j += dc; }
        if (inBounds(i, j) && b[i][j] === EMPTY) open++;
        i = r - dr; j = c - dc;
        while (inBounds(i, j) && b[i][j] === player) { count++; i -= dr; j -= dc; }
        if (inBounds(i, j) && b[i][j] === EMPTY) open++;
        total += patternValue(count, open);
      }
      return total;
    }

    // 整盘评估（me 视角）
    function evaluate(b, me, opp) {
      let mine = 0, other = 0;
      for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
          if (b[r][c] === me) mine += pointScore(b, r, c, me);
          else if (b[r][c] === opp) other += pointScore(b, r, c, opp);
        }
      }
      return mine - 1.15 * other; // 略偏防守
    }

    function moveValue(b, r, c, me, opp) {
      b[r][c] = me; const off = pointScore(b, r, c, me); b[r][c] = EMPTY;
      b[r][c] = opp; const def = pointScore(b, r, c, opp); b[r][c] = EMPTY;
      return off + 0.9 * def;
    }

    // 生成候选：已有棋子周围空位（半径2）；空盘给中心
    function candidates(b, player) {
      const opp = player === WHITE ? BLACK : WHITE;
      const seen = new Set();
      const cells = [];
      let hasStone = false;
      for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
          if (b[r][c] !== EMPTY) {
            hasStone = true;
            for (let dr = -2; dr <= 2; dr++) {
              for (let dc = -2; dc <= 2; dc++) {
                const nr = r + dr, nc = c + dc;
                if (inBounds(nr, nc) && b[nr][nc] === EMPTY) {
                  const key = nr * GRID + nc;
                  if (!seen.has(key)) { seen.add(key); cells.push([nr, nc]); }
                }
              }
            }
          }
        }
      }
      if (!hasStone) return [[Math.floor(GRID / 2), Math.floor(GRID / 2)]];
      cells.sort((a, x) => moveValue(b, x[0], x[1], player, opp) - moveValue(b, a[0], a[1], player, opp));
      return cells;
    }

    // 是否落子即连成五（给自己找一步制胜点）
    function findWinningMove(b, player) {
      const cells = candidates(b, player);
      for (let i = 0; i < cells.length; i++) {
        const r = cells[i][0], c = cells[i][1];
        b[r][c] = player;
        const win = checkWinAt(b, r, c, player);
        b[r][c] = EMPTY;
        if (win) return [r, c];
      }
      return null;
    }

    // 连五判定（从某点某色向四周累计）
    function checkWinAt(b, r, c, player) {
      const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      for (let k = 0; k < dirs.length; k++) {
        const dr = dirs[k][0], dc = dirs[k][1];
        let count = 1;
        let i = r + dr, j = c + dc;
        while (inBounds(i, j) && b[i][j] === player) { count++; i += dr; j += dc; }
        i = r - dr; j = c - dc;
        while (inBounds(i, j) && b[i][j] === player) { count++; i -= dr; j -= dc; }
        if (count >= 5) return true;
      }
      return false;
    }

    // ---------- 禁手规则（仅对黑棋生效）----------
    // 落子为黑且未成五时调用：三三 / 四四 / 长连 即禁手（五连优先于禁手）
    function hasFour(b, r, c, dr, dc) {
      // 该方向是否存在「四」威胁：存在空格 k，填入黑后从 (r,c) 起连成 5
      for (let k = -4; k <= 4; k++) {
        if (k === 0) continue;
        const rr = r + dr * k, cc = c + dc * k;
        if (!inBounds(rr, cc) || b[rr][cc] !== EMPTY) continue;
        b[rr][cc] = BLACK;
        const win = checkWinAt(b, r, c, BLACK);
        b[rr][cc] = EMPTY;
        if (win) return true;
      }
      return false;
    }

    function hasOpenThree(b, r, c, dr, dc) {
      // 活三：该方向存在 ≥2 个可成「四」的点（两端皆可做杀）
      let count = 0;
      for (let k = -4; k <= 4; k++) {
        if (k === 0) continue;
        const rr = r + dr * k, cc = c + dc * k;
        if (!inBounds(rr, cc) || b[rr][cc] !== EMPTY) continue;
        b[rr][cc] = BLACK;
        const four = hasFour(b, r, c, dr, dc);
        b[rr][cc] = EMPTY;
        if (four) count++;
      }
      return count >= 2;
    }

    function isForbidden(b, r, c) {
      const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      // 长连（六子及以上）
      for (const [dr, dc] of dirs) {
        let cnt = 1;
        let i = r + dr, j = c + dc;
        while (inBounds(i, j) && b[i][j] === BLACK) { cnt++; i += dr; j += dc; }
        i = r - dr; j = c - dc;
        while (inBounds(i, j) && b[i][j] === BLACK) { cnt++; i -= dr; j -= dc; }
        if (cnt >= 6) return true;
      }
      let fours = 0;
      for (const [dr, dc] of dirs) if (hasFour(b, r, c, dr, dc)) fours++;
      if (fours >= 2) return true;            // 四四禁手
      let threes = 0;
      for (const [dr, dc] of dirs) {
        if (hasFour(b, r, c, dr, dc)) continue;
        if (hasOpenThree(b, r, c, dr, dc)) threes++;
      }
      if (threes >= 2) return true;           // 三三禁手
      return false;
    }

    function isForbiddenTemp(b, r, c) {
      b[r][c] = BLACK;
      const f = isForbidden(b, r, c);
      b[r][c] = EMPTY;
      return f;
    }

    // ---------- 极小化极大 + α-β ----------
    function minimax(b, depth, alpha, beta, player, last, me, opp) {
      if (last && checkWinAt(b, last.r, last.c, last.player)) {
        // 上一步落子方 last.player 连成五
        return last.player === me ? WIN : -WIN;
      }
      if (depth === 0) return evaluate(b, me, opp);
      const cfg = LEVELS[level];
      let cells = candidates(b, player);
      if (cfg.cap && cells.length > cfg.cap) cells = cells.slice(0, cfg.cap);
      const maximizing = (player === me);
      let best = maximizing ? -WIN : WIN;
      for (let i = 0; i < cells.length; i++) {
        const r = cells[i][0], c = cells[i][1];
        // 搜索中若轮到 AI 执黑，跳过禁手点
        let forbidden = false;
        if (player === me && me === BLACK && forbiddenActive()) {
          b[r][c] = BLACK; forbidden = isForbidden(b, r, c); b[r][c] = EMPTY;
        }
        if (forbidden) continue;
        b[r][c] = player;
        const v = minimax(b, depth - 1, alpha, beta, (player === BLACK ? WHITE : BLACK), { r, c, player }, me, opp);
        b[r][c] = EMPTY;
        if (maximizing) {
          if (v > best) best = v;
          if (best > alpha) alpha = best;
        } else {
          if (v < best) best = v;
          if (best < beta) beta = best;
        }
        if (beta <= alpha) break;
      }
      return best;
    }

    // ---------- AI 落子 ----------
    function chooseAIMove() {
      const me = aiColor, opp = humanColor;
      // 1) 自己能赢直接赢（五连优先，覆盖禁手）
      let m = findWinningMove(board, me);
      if (m) return m;
      // 2) 对手能赢必须挡（若对手为黑且此制胜点恰是禁手，则黑方不能下，非真实威胁）
      m = findWinningMove(board, opp);
      if (m) {
        if (!(opp === BLACK && forbiddenActive() && isForbiddenTemp(board, m[0], m[1]))) return m;
      }

      const cfg = LEVELS[level];
      const cells = candidates(board, me);
      const blackBan = (me === BLACK && forbiddenActive());

      if (level === "easy") {
        let safe = blackBan ? cells.filter(([r, c]) => !isForbiddenTemp(board, r, c)) : cells;
        if (safe.length === 0) safe = cells;
        return safe[Math.floor(Math.random() * safe.length)];
      }
      if (level === "medium") {
        let best = null, bestV = -Infinity;
        for (let i = 0; i < cells.length; i++) {
          const r = cells[i][0], c = cells[i][1];
          if (blackBan && isForbiddenTemp(board, r, c)) continue;
          const v = moveValue(board, r, c, me, opp);
          if (v > bestV) { bestV = v; best = [r, c]; }
        }
        return best;
      }
      // hard / insane / hell：搜索
      const capped = cfg.cap && cells.length > cfg.cap ? cells.slice(0, cfg.cap) : cells;
      let best = capped[0], bestV = -WIN;
      for (let i = 0; i < capped.length; i++) {
        const r = capped[i][0], c = capped[i][1];
        if (blackBan && isForbiddenTemp(board, r, c)) continue;
        board[r][c] = me;
        const v = minimax(board, cfg.depth - 1, -WIN, WIN, opp, { r, c, player: me }, me, opp);
        board[r][c] = EMPTY;
        if (v > bestV) { bestV = v; best = [r, c]; }
      }
      return best;
    }

    // ---------- 渲染 ----------
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    let step = 0, pad = 0, dpr = 1;

    function resizeCanvas() {
      const wrap = canvas.parentElement;
      const size = wrap.clientWidth;
      dpr = window.devicePixelRatio || 1;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      pad = size * 0.045;
      step = (size - pad * 2) / (GRID - 1);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function px(i) { return pad + i * step; }

    function draw() {
      const size = canvas.width / dpr;
      ctx.clearRect(0, 0, size, size);
      ctx.save();
      // 重组时棋盘轻微脉冲缩放，强化“重新洗牌”的视觉
      if (scrambleActive()) {
        const prog = (Date.now() - scrambleStart) / 5000;
        const pulse = 1 + 0.05 * Math.sin(prog * Math.PI * 4);
        ctx.translate(size / 2, size / 2);
        ctx.scale(pulse, pulse);
        ctx.translate(-size / 2, -size / 2);
      }
      drawBoardContents();
      ctx.restore();
      if (scrambleActive()) drawScrambleParticles();
    }

    function drawBoardContents() {
      const size = canvas.width / dpr;
      // 网格
      ctx.strokeStyle = "rgba(60,40,20,0.55)";
      ctx.lineWidth = 1;
      for (let i = 0; i < GRID; i++) {
        ctx.beginPath(); ctx.moveTo(px(0), px(i)); ctx.lineTo(px(GRID - 1), px(i)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px(i), px(0)); ctx.lineTo(px(i), px(GRID - 1)); ctx.stroke();
      }
      // 星位
      const stars = [3, 7, 11];
      ctx.fillStyle = "rgba(60,40,20,0.7)";
      for (let a = 0; a < stars.length; a++)
        for (let b = 0; b < stars.length; b++) {
          ctx.beginPath(); ctx.arc(px(stars[a]), px(stars[b]), 3, 0, Math.PI * 2); ctx.fill();
        }
      // 棋子
      const r = step * 0.42;
      for (let i = 0; i < GRID; i++)
        for (let j = 0; j < GRID; j++) {
          if (board[i][j] === EMPTY) continue;
          const x = px(j), y = px(i);
          const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
          if (board[i][j] === BLACK) { g.addColorStop(0, "#6b7280"); g.addColorStop(1, "#0b0b0b"); }
          else { g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#cbd5e1"); }
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
      // 最后一手标记
      if (lastMove) {
        ctx.strokeStyle = "#fbbf24";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(px(lastMove.c), px(lastMove.r), r * 0.35, 0, Math.PI * 2); ctx.stroke();
      }
    }

    function scrambleActive() {
      return scrambling && (Date.now() - scrambleStart) < 5000;
    }

    // 旋转粒子特效：旋转光环 + 黑白棋子粒子环（持续 5 秒，末段淡出）
    function drawScrambleParticles() {
      const size = canvas.width / dpr;
      const cx = size / 2, cy = size / 2;
      const t = Date.now() - scrambleStart;
      const prog = Math.max(0, Math.min(1, t / 5000));
      const alpha = prog < 0.8 ? 1 : (1 - (prog - 0.8) / 0.2);
      ctx.save();
      ctx.globalAlpha = alpha * 0.9;
      const ringR = Math.min(cx, cy) * 0.62;
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(34,211,238,0.65)";
      ctx.beginPath(); ctx.arc(cx, cy, ringR, t / 600, t / 600 + Math.PI * 1.4); ctx.stroke();
      ctx.strokeStyle = "rgba(74,222,128,0.55)";
      ctx.beginPath(); ctx.arc(cx, cy, ringR * 0.8, -t / 500, -t / 500 + Math.PI * 1.2); ctx.stroke();
      for (const p of scrambleParticles) {
        const a = p.ang + (t / 1000) * p.spd;
        const x = cx + p.r * Math.cos(a), y = cy + p.r * Math.sin(a);
        ctx.beginPath();
        ctx.fillStyle = p.col;
        if (p.glow) { ctx.shadowColor = p.col; ctx.shadowBlur = 8; }
        else { ctx.shadowBlur = 0; }
        ctx.arc(x, y, p.size, 0, Math.PI * 2); ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    function animateScramble() {
      draw();
      if (scrambleActive()) requestAnimationFrame(animateScramble);
    }

    // ---------- 交互 ----------
    const statusEl = document.getElementById("status");

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = "status" + (cls ? " " + cls : "");
    }

    function humanPlace(r, c) {
      if (gameOver || thinking || scrambling || current !== humanColor || board[r][c] !== EMPTY) return;
      // 玩家执黑且当前启用禁手：先判定（五连优先于禁手）
      if (humanColor === BLACK && forbiddenActive()) {
        board[r][c] = BLACK;
        const win = checkWinAt(board, r, c, BLACK);
        const fb = isForbidden(board, r, c);
        board[r][c] = EMPTY;
        if (win) { board[r][c] = BLACK; lastMove = { r, c }; draw(); endGame(true); return; }
        if (fb) { board[r][c] = BLACK; lastMove = { r, c }; draw(); endGame(false, "禁手判负"); return; }
      }
      board[r][c] = humanColor; lastMove = { r, c };
      draw();
      if (checkWinAt(board, r, c, humanColor)) { endGame(true); return; }
      if (isBoardFull()) { endGame(null); return; }
      current = aiColor;
      finishMove();
    }

    function aiTurn() {
      const m = chooseAIMove();
      thinking = false;
      if (!m) { endGame(null); return; }
      board[m[0]][m[1]] = aiColor; lastMove = { r: m[0], c: m[1] };
      draw();
      if (checkWinAt(board, m[0], m[1], aiColor)) { endGame(false); return; }
      if (isBoardFull()) { endGame(null); return; }
      current = humanColor;
      finishMove();
    }

    // 一手结束后：计手数，地狱难度每 20 手重组棋盘，否则切换行棋方
    function finishMove() {
      plyCount++;
      if (level === "hell" && plyCount > 0 && plyCount % 20 === 0 && !gameOver) {
        startScramble();
        return;
      }
      switchTurn();
    }

    function switchTurn() {
      if (current === aiColor) {
        setStatus("AI 思考中…");
        thinking = true;
        setTimeout(aiTurn, 30);
      } else {
        thinking = false;
        setStatus(current === BLACK ? "轮到你了（黑棋）" : "轮到你了（白棋）");
      }
    }

    // ---------- 棋盘重组（地狱难度）----------
    function emptyBoard() {
      const b = [];
      for (let i = 0; i < GRID; i++) b.push(new Array(GRID).fill(EMPTY));
      return b;
    }
    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function countColor(color) {
      let n = 0;
      for (let r = 0; r < GRID; r++)
        for (let c = 0; c < GRID; c++)
          if (board[r][c] === color) n++;
      return n;
    }
    // 某色是否存在“下一手即连五”的制胜点（用于重组后校验）
    function hasImmediateWin(b, color) {
      const seen = new Set();
      for (let r = 0; r < GRID; r++)
        for (let c = 0; c < GRID; c++) {
          if (b[r][c] !== color) continue;
          for (let dr = -1; dr <= 1; dr++)
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (!inBounds(nr, nc) || b[nr][nc] !== EMPTY) continue;
              const key = nr * GRID + nc;
              if (seen.has(key)) continue;
              seen.add(key);
              b[nr][nc] = color;
              const w = checkWinAt(b, nr, nc, color);
              b[nr][nc] = EMPTY;
              if (w) return true;
            }
        }
      return false;
    }
    // 重组后的合法性：无五连（已分胜负）、且无任一方“下一手即胜”
    function validateScramble(b) {
      for (let r = 0; r < GRID; r++)
        for (let c = 0; c < GRID; c++)
          if (b[r][c] !== EMPTY && checkWinAt(b, r, c, b[r][c])) return false;
      if (hasImmediateWin(b, BLACK)) return false;
      if (hasImmediateWin(b, WHITE)) return false;
      return true;
    }
    function safePlaceNoWin(nb, nw) {
      const all = [];
      for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++) all.push([r, c]);
      for (let attempt = 0; attempt < 400; attempt++) {
        const b = emptyBoard();
        const cells = shuffle(all.slice());
        let bi = 0, wi = 0;
        for (const [r, c] of cells) {
          if (bi < nb) { b[r][c] = BLACK; if (validateScramble(b)) bi++; else b[r][c] = EMPTY; }
          else if (wi < nw) { b[r][c] = WHITE; if (validateScramble(b)) wi++; else b[r][c] = EMPTY; }
          if (bi === nb && wi === nw) return b;
        }
      }
      return emptyBoard();
    }
    // 随机打乱现有棋子分布（保持双方数量），并保证不出现直接胜负
    function makeScrambledBoard() {
      const nb = countColor(BLACK), nw = countColor(WHITE), total = nb + nw;
      if (total === 0) return emptyBoard();
      const all = [];
      for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++) all.push([r, c]);
      for (let attempt = 0; attempt < 2500; attempt++) {
        const b = emptyBoard();
        const chosen = shuffle(all.slice()).slice(0, total);
        const cols = [];
        for (let i = 0; i < nb; i++) cols.push(BLACK);
        for (let i = 0; i < nw; i++) cols.push(WHITE);
        shuffle(cols);
        for (let i = 0; i < chosen.length; i++) b[chosen[i][0]][chosen[i][1]] = cols[i];
        if (validateScramble(b)) return b;
      }
      return safePlaceNoWin(nb, nw);
    }
    function startScramble() {
      board = makeScrambledBoard();
      lastMove = null;
      scrambling = true;
      scrambleStart = Date.now();
      // 生成旋转粒子（黑白棋子环绕）
      scrambleParticles = [];
      const size = canvas.width / dpr;
      const cx = size / 2, cy = size / 2;
      const maxR = Math.min(cx, cy) * 0.95;
      for (let i = 0; i < 80; i++) {
        scrambleParticles.push({
          r: 28 + Math.random() * maxR,
          ang: Math.random() * Math.PI * 2,
          spd: (0.6 + Math.random() * 2.6) * (Math.random() < 0.5 ? -1 : 1),
          size: 2 + Math.random() * 4,
          col: Math.random() < 0.5 ? "#0b0b0b" : "#ffffff",
          glow: Math.random() < 0.5
        });
      }
      setStatus("⚡ 棋盘重组！", "scramble");
      draw();
      animateScramble();
      setTimeout(function () {
        scrambling = false;
        draw();
        switchTurn();
      }, 5000);
    }

    function isBoardFull() {
      for (let i = 0; i < GRID; i++)
        for (let j = 0; j < GRID; j++)
          if (board[i][j] === EMPTY) return false;
      return true;
    }

    function endGame(win, reason) {
      gameOver = true;
      if (win === true) setStatus("🎉 你赢了！", "win");
      else if (win === false) setStatus(reason ? ("😖 你输了：" + reason) : "😖 你输了，再战一局？", "lose");
      else setStatus("🤝 平局", "");
    }

    function getCell(evt) {
      const rect = canvas.getBoundingClientRect();
      const cx = (evt.clientX !== undefined ? evt.clientX : evt.touches[0].clientX) - rect.left;
      const cy = (evt.clientY !== undefined ? evt.clientY : evt.touches[0].clientY) - rect.top;
      const size = rect.width;
      const p = size * 0.045;
      const s = (size - p * 2) / (GRID - 1);
      const c = Math.round((cx - p) / s);
      const r = Math.round((cy - p) / s);
      if (!inBounds(r, c)) return null;
      // 只接受离交叉点足够近的点击
      const dx = cx - (p + c * s), dy = cy - (p + r * s);
      if (Math.hypot(dx, dy) > s * 0.5) return null;
      return { r, c };
    }

    function onTap(evt) {
      const cell = getCell(evt);
      if (cell) humanPlace(cell.r, cell.c);
    }

    canvas.addEventListener("click", onTap);
    canvas.addEventListener("touchstart", function (e) {
      e.preventDefault();
      const t = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const cx = t.clientX - rect.left, cy = t.clientY - rect.top;
      const size = rect.width, p = size * 0.045, s = (size - p * 2) / (GRID - 1);
      const c = Math.round((cx - p) / s), r = Math.round((cy - p) / s);
      if (inBounds(r, c)) humanPlace(r, c);
    }, { passive: false });

    // ---------- 难度 / 执棋方 / 重开 ----------
    const diffEl = document.getElementById("diff");
    const sideEl = document.getElementById("side");

    function setHumanSide(side) {
      humanColor = side;
      aiColor = (side === BLACK) ? WHITE : BLACK;
      [...sideEl.children].forEach(b => {
        if (b.hasAttribute("data-side"))
          b.classList.toggle("active", b.getAttribute("data-side") === (side === BLACK ? "black" : "white"));
      });
    }

    diffEl.addEventListener("click", function (e) {
      const btn = e.target.closest("button[data-level]");
      if (!btn) return;
      level = btn.getAttribute("data-level");
      [...diffEl.children].forEach(b => b.classList.toggle("active", b === btn));
      // 困难以上默认 AI 执黑（玩家执白），其余默认玩家执黑；玩家可手动改回
      setHumanSide(isHardPlus(level) ? WHITE : BLACK);
      newGame();
    });

    sideEl.addEventListener("click", function (e) {
      const btn = e.target.closest("button[data-side]");
      if (!btn) return;
      setHumanSide(btn.getAttribute("data-side") === "black" ? BLACK : WHITE);
      newGame();
    });

    document.getElementById("restart").addEventListener("click", newGame);
    window.addEventListener("resize", resizeCanvas);

    function newGame() {
      board = [];
      for (let i = 0; i < GRID; i++) { board.push(new Array(GRID).fill(EMPTY)); }
      current = BLACK;            // 黑棋恒先手
      gameOver = false; thinking = false; lastMove = null;
      plyCount = 0; scrambling = false;
      draw();
      if (aiColor === BLACK) {
        // AI 执黑先行
        setStatus("AI（黑）先行，请稍候…");
        thinking = true;
        setTimeout(aiTurn, 300);
      } else {
        setStatus(humanColor === BLACK ? "你执黑先行，点击棋盘落子" : "你执白后手，AI（黑）先行…");
        thinking = false;
      }
    }

    newGame();
    resizeCanvas();
  })();
  </script>
</body>
</html>
