  <title>小游戏合集</title>
  <style>
    :root {
      --bg-0: #0b1020;
      --panel: rgba(255, 255, 255, 0.04);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-0: #e8ecf5;
      --text-1: #9aa6c4;
      --accent: #4ade80;
      --accent-2: #22d3ee;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(1200px 800px at 50% -10%, #1a2440, var(--bg-0));
      color: var(--text-0);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 20px;
    }
    .lobby { width: 100%; max-width: 420px; text-align: center; }
    .lobby header { margin-bottom: 28px; }
    .lobby h1 {
      font-size: 28px; font-weight: 800; letter-spacing: 0.5px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .lobby header p { margin-top: 8px; color: var(--text-1); font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 24px 16px; border-radius: 18px;
      background: var(--panel); border: 1px solid var(--panel-border);
      text-decoration: none; color: var(--text-0);
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .card:active { transform: scale(0.97); }
    .card:hover { border-color: var(--accent); background: rgba(74,222,128,0.06); }
    .card .emoji { font-size: 54px; line-height: 1; }
    .card .name { font-size: 19px; font-weight: 700; }
    .card .desc { font-size: 12px; color: var(--text-1); min-height: 32px; }
    .card .play {
      margin-top: 4px; padding: 8px 18px; border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #06121f; font-weight: 700; font-size: 14px;
    }
    .lobby footer { margin-top: 28px; color: var(--text-1); font-size: 12px; }
    @media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>

        <div class="play">开始 ▶</div>
      </a>
      <a class="card" href="anqi.html">

        <div class="play">开始 ▶</div>
